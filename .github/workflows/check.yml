name: Check Zwoice
on: [push, pull_request]
permissions:
  contents: read
jobs:
  observer-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build private observer runtime (never published)
        run: docker build --platform linux/amd64 -f deploy/observer/Dockerfile -t zwoice-observer:test .
      - name: Verify official headless runtime without credentials or network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=64m --tmpfs /home/node:rw,nosuid,size=32m,uid=1000,gid=1000 \
            --entrypoint /opt/sauce/sauce4zwift -e ELECTRON_RUN_AS_NODE=1 zwoice-observer:test \
            /opt/sauce/resources/app.asar/src/headless.mjs --headless --help > /tmp/sauce-help.txt
          grep -q -- --athlete-id /tmp/sauce-help.txt
          ! grep -q 'World data load error' /tmp/sauce-help.txt
      - name: Verify private settings initialization
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=64m --entrypoint node zwoice-observer:test \
            /opt/zwoice/init.mjs /tmp/observer-home 12080
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/zwoice
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
  release-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release.mjs dev
      - uses: actions/upload-artifact@v4
        with:
          name: zwoice-desktop-packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/SHA256SUMS

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/windows-installer.ps1 -Version 1.3.0
      - name: Install, launch and uninstall without elevation
        shell: pwsh
        run: |
          $installDir = "$env:RUNNER_TEMP\Zwoice-installed"
          $p = Start-Process dist/Zwoice-Windows-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          $app = Start-Process "$installDir\Zwoice.exe" -ArgumentList "-open=false" -PassThru
          try {
            $healthy = $false
            for ($i=0; $i -lt 20; $i++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8787/healthz
                if ($health.service -eq "zwoice-desktop") { $healthy=$true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $healthy) { throw "Installed app did not start" }
            Invoke-WebRequest -Method POST -Headers @{Origin="http://127.0.0.1:8787"} http://127.0.0.1:8787/api/quit | Out-Null
            $app.WaitForExit(10000) | Out-Null
          } finally {
            if (-not $app.HasExited) { $app.Kill() }
          }
          $u = Start-Process "$installDir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall failed" }
          if (Test-Path "$installDir\Zwoice.exe") { throw "Uninstall left executable behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: zwoice-windows-installer
          path: dist/Zwoice-Windows-Setup.exe
